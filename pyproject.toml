[project]
name = "blender-asset-transformer"
version = "0.0.0" # real version lives in blender_manifest.toml
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff", "fake-bpy-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N"]
# Blender requires PREFIX_TYPE_name class names (e.g. BAT_OT_import).
ignore = ["N801"]
